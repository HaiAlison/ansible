---
# ── UFW Firewall — luôn allow SSH TRƯỚC khi enable để tránh lock out ─────

- name: Cài UFW
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: yes

- name: Đặt policy mặc định deny inbound, allow outbound
  community.general.ufw:
    policy: deny
    direction: incoming

- name: Allow outbound mặc định
  community.general.ufw:
    policy: allow
    direction: outgoing

- name: Allow TCP ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ firewall_allowed_tcp_ports }}"

- name: Allow UDP ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: udp
  loop: "{{ firewall_allowed_udp_ports }}"
  when: firewall_allowed_udp_ports | length > 0

- name: Enable UFW (logging on)
  community.general.ufw:
    state: enabled
    logging: 'on'

- name: Kiểm tra trạng thái UFW
  ansible.builtin.command: ufw status verbose
  register: ufw_status
  changed_when: false

- name: Hiển thị trạng thái UFW
  ansible.builtin.debug:
    msg: "{{ ufw_status.stdout_lines }}"
