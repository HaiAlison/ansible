---
- name: Restart Redis
  ansible.builtin.systemd:
    name: redis-server
    state: restarted
    daemon_reload: yes

- name: Reload Redis (config thay đổi nhưng không cần restart hoàn toàn)
  ansible.builtin.command: redis-cli CONFIG REWRITE
  changed_when: false
  when: redis_requirepass | length == 0
