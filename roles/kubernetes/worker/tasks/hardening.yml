---
# Security hardening tasks cho Kubernetes worker
- name: Cấu hình kubelet với security settings
  ansible.builtin.copy:
    dest: /var/lib/kubelet/config.yaml
    content: |
      # Kubelet security configuration
      # Có thể thêm các cấu hình bảo mật cụ thể ở đây
    mode: "0644"
  when: false  # Tạm thời tắt, cần cấu hình cụ thể hơn

- name: Cấu hình sysctl cho worker node
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k8s-worker-hardening.conf
    content: |
      # Additional security hardening for worker nodes
      net.ipv4.conf.all.send_redirects = 0
      net.ipv4.conf.default.send_redirects = 0
      net.ipv4.conf.all.accept_redirects = 0
      net.ipv4.conf.default.accept_redirects = 0
      net.ipv4.conf.all.secure_redirects = 0
      net.ipv4.conf.default.secure_redirects = 0
    mode: "0644"
  notify: Reload sysctl

- name: Verify worker node security settings
  ansible.builtin.command: sysctl -a | grep -E "ip_forward|bridge-nf"
  register: sysctl_check
  changed_when: false
  failed_when: false
