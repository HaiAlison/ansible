---
# Tasks verify cho RabbitMQ
- name: Verify RabbitMQ service đang chạy
  ansible.builtin.systemd:
    name: rabbitmq-server
    state: started
  register: rabbitmq_service_status
  failed_when: rabbitmq_service_status.status.ActiveState != "active"

- name: Verify RabbitMQ đang lắng nghe trên port AMQP
  ansible.builtin.wait_for:
    port: 5672
    delay: 5
    timeout: 30
  register: rabbitmq_amqp_check
  failed_when: false

- name: Verify RabbitMQ management plugin đang chạy
  ansible.builtin.wait_for:
    port: 15672
    delay: 5
    timeout: 30
  register: rabbitmq_mgmt_check
  failed_when: false

- name: Verify RabbitMQ node status
  ansible.builtin.command: rabbitmqctl status
  register: rabbitmq_node_status
  changed_when: false
  failed_when: rabbitmq_node_status.rc != 0

- name: Verify default user tồn tại
  ansible.builtin.command: rabbitmqctl list_users
  register: rabbitmq_users
  changed_when: false
  failed_when: "'{{ rabbitmq_default_user }}' not in rabbitmq_users.stdout"

- name: Verify default vhost tồn tại
  ansible.builtin.command: rabbitmqctl list_vhosts
  register: rabbitmq_vhosts
  changed_when: false
  failed_when: "'{{ rabbitmq_default_vhost }}' not in rabbitmq_vhosts.stdout"

- name: Verify guest user đã bị xóa (bảo mật)
  ansible.builtin.command: rabbitmqctl list_users
  register: rabbitmq_users_check
  changed_when: false
  failed_when: "'guest' in rabbitmq_users_check.stdout"

- name: Hiển thị thông tin RabbitMQ
  ansible.builtin.debug:
    msg: "RabbitMQ đang chạy và sẵn sàng. Management UI: http://{{ ansible_host }}:15672"
