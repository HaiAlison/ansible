---
# Task này sẽ cập nhật /etc/hosts với thông tin từ inventory
# Lưu ý: Cần chạy với gather_facts: true

- name: Tạo block quản lý /etc/hosts cho tất cả hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED BLOCK - Cluster hosts"
    block: |
      {% for host in groups['all'] %}
      {{ hostvars[host]['ansible_host'] | default(hostvars[host]['ansible_default_ipv4']['address'] | default(host)) }} {{ hostvars[host]['ansible_hostname'] | default(hostvars[host]['inventory_hostname'] | default(host)) }} {{ hostvars[host]['inventory_hostname'] | default(host) }}
      {% endfor %}
    create: yes
