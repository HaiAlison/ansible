---
# Cài đặt containerd và các thành phần Kubernetes dùng cho cả master/worker
- name: Cài đặt gói phụ thuộc cho apt qua HTTPS
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: Tải GPG key Kubernetes
  ansible.builtin.get_url:
    url: https://packages.cloud.google.com/apt/doc/apt-key.gpg
    dest: /usr/share/keyrings/kubernetes-archive-keyring.gpg
    mode: "0644"
  when: ansible_os_family == "Debian"

- name: Thêm repo Kubernetes
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/kubernetes-archive-keyring.gpg] https://apt.kubernetes.io/ kubernetes-xenial main"
    state: present
    filename: kubernetes
  when: ansible_os_family == "Debian"

- name: Cài containerd
  ansible.builtin.apt:
    name: containerd
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: Tạo thư mục cấu hình containerd
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: "0755"

- name: Sinh cấu hình mặc định cho containerd nếu chưa có
  ansible.builtin.command: containerd config default
  register: containerd_config
  changed_when: false
  check_mode: no

- name: Ghi file cấu hình containerd
  ansible.builtin.copy:
    content: "{{ containerd_config.stdout }}"
    dest: /etc/containerd/config.toml
  when: containerd_config.stdout is defined

- name: Đặt SystemdCgroup cho containerd
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: "SystemdCgroup = false"
    replace: "SystemdCgroup = true"

- name: Enable & restart containerd
  ansible.builtin.service:
    name: containerd
    state: restarted
    enabled: yes

- name: Pin version Kubernetes packages
  ansible.builtin.apt:
    name:
      - "kubelet={{ kubernetes_version }}-00"
      - "kubeadm={{ kubernetes_version }}-00"
      - "kubectl={{ kubernetes_version }}-00"
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: Hold version để tránh tự động update
  ansible.builtin.command: apt-mark hold kubelet kubeadm kubectl
  when: ansible_os_family == "Debian"

- name: Enable kubelet
  ansible.builtin.service:
    name: kubelet
    enabled: yes

- name: Thiết lập sysctl cho bridge và ip_forward
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-ip6tables = 1
      net.bridge.bridge-nf-call-iptables = 1
      net.ipv4.ip_forward = 1
      vm.swappiness = 0
  notify: Reload sysctl

- name: Load br_netfilter module
  ansible.builtin.modprobe:
    name: br_netfilter
    state: present

- name: Đảm bảo br_netfilter được load khi khởi động
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      br_netfilter