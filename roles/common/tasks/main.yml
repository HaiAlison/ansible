---
- name: Đặt hostname
  ansible.builtin.hostname:
    name: "{{ ansible_hostname | default(inventory_hostname) }}"
  when: ansible_hostname is defined or inventory_hostname is defined

- name: Đặt timezone
  ansible.builtin.timezone:
    name: Asia/Ho_Chi_Minh

- name: Cấu hình locale
  ansible.builtin.locale_gen:
    name: en_US.UTF-8
    state: present

- name: Cập nhật cache package
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

- name: Cài gói tiện ích cơ bản
  ansible.builtin.package:
    name:
      - vim
      - curl
      - htop
      - net-tools
      - jq
      - git
      - wget
      - unzip
    state: present

# ── Swap management (toggle qua common_swap_enabled) ──────────────────────
- name: Tắt swap (dành cho K8s)
  ansible.builtin.command: swapoff -a
  when:
    - not common_swap_enabled | default(false)
    - ansible_swaptotal_mb | default(0) > 0
  changed_when: false

- name: Comment các dòng swap trong /etc/fstab (K8s)
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(.*\sswap\s.*)$'
    replace: '# \1'
  when: not common_swap_enabled | default(false)

- name: Tạo swap file cho VPS
  ansible.builtin.command: fallocate -l {{ common_swap_size_mb }}M /swapfile
  args:
    creates: /swapfile
  when: common_swap_enabled | default(false)

- name: Đặt quyền swap file
  ansible.builtin.file:
    path: /swapfile
    owner: root
    group: root
    mode: '0600'
  when: common_swap_enabled | default(false)

- name: Format swap file
  ansible.builtin.command: mkswap /swapfile
  args:
    creates: /proc/swaps
  when: common_swap_enabled | default(false)
  changed_when: true

- name: Bật swap
  ansible.builtin.command: swapon /swapfile
  register: swapon_result
  changed_when: swapon_result.rc == 0
  failed_when: false
  when: common_swap_enabled | default(false)

- name: Thêm swap vào /etc/fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: '/swapfile none swap sw 0 0'
    state: present
  when: common_swap_enabled | default(false)

- name: Cấu hình swappiness
  ansible.posix.sysctl:
    name: vm.swappiness
    value: '10'
    state: present
    reload: yes
  when: common_swap_enabled | default(false)

- name: Include hosts configuration
  ansible.builtin.include_tasks: hosts.yml

